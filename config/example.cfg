; GeMTeX consortium: agreement report of one site (`site-report`, see README).
; Copy this file to config/site.cfg, set SITE and the paths, and run
;   uv run --no-dev gemtex-iaa-semantic site-report config/site.cfg
; Send only the folder `share/` of the run directory; `local/` contains real names and stays at the site.
; Paths are relative to the working directory.

[default]
; the name of your site as agreed in the consortium (written into the report)
SITE =
; zipped INCEpTION project exports (UIMA CAS XMI): files, directories (every *.zip in them) or glob patterns,
; comma or line separated. A document name in several exports is one document if its text is the same in all of them.
PATH_PROJECT = data/*.zip
DIR_OUTPUT = data/results
DIR_CACHE = data/cache
VERBOSE = 0

[annotation]
CONCEPT_LAYER = gemtex.Concept
ID_FEATURE = id
LITERAL_FEATURE = literal
RELATION_LAYER = gemtex.Relation
RELATION_FEATURE = kind
NO_HUMAN_LAYER = webanno.custom.No_Human
; annotation document states (exportedproject.json) to include, comma separated
STATES = FINISHED
; documents with fewer annotators in STATES are not read (only multiply annotated documents are analysed)
MIN_ANNOTATORS = 2
; usernames or uiNames to exclude, e.g. test accounts (INITIAL_CAS and CURATION_USER are always excluded)
SKIP_ANNOTATORS = []
; annotation documents excluded before the analysis (counted in the report):
; identical to the automatic pre-annotation (INITIAL_CAS), i.e. nothing annotated
EXCLUDE_UNTOUCHED = True
; identical to another annotation document of the same document; one of each group is kept
EXCLUDE_COPIES = True
; F1 against the pre-annotation >= 1 - PREANNO_LOW_CHANGE ([analysis]); always counted, excluded only if True
EXCLUDE_LOW_CHANGE = False

[snomed]
; the SNOMED CT HDF5 file distributed in the consortium (International Edition 2024-04-01)
HDF5 = data/snomed/snograscco_snomedct_20240401.hdf5

[analysis]
; resamples of the document bootstrap (95 % CIs) and its seed
BOOTSTRAP = 1000
SEED = 13
; compare with the pre-annotation (INITIAL_CAS): untouched / low-change documents, inherited agreement
PREANNOTATION = True
PREANNO_LOW_CHANGE = 0.05
